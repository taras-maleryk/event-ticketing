[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

filterwarnings = [
    "ignore:'crypt' is deprecated and slated for removal in Python 3.13:DeprecationWarning:passlib.utils",
    "ignore:Accessing argon2.__version__ is deprecated:DeprecationWarning:passlib.handlers.argon2",
]


[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]

check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true

warn_return_any = true
warn_unused_ignores = true
show_error_codes = true


[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true


[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["alembic/versions"]


[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
]