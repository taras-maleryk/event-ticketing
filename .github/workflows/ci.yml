name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  checks:
    name: Quality checks and tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/event_ticketing_test"
      TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/event_ticketing_test"
      SYNC_DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/event_ticketing_test"
      REDIS_URL: "redis://localhost:6379/0"
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      ENVIRONMENT: "test"
      DB_ECHO: "false"

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: event_ticketing_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d event_ticketing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Ruff lint checks
        run: ruff check app tests alembic

      - name: Check Ruff formatting
        run: ruff format --check app tests alembic

      - name: Run mypy
        run: mypy app

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q