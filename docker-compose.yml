services:
  db:
    image: postgres:16
    env_file:
      - .env.docker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  alembic:
    build: .
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head

  api:
    build: .
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      alembic:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: .
    env_file:
      - .env.docker
    volumes:
      - .:/app
    depends_on:
      alembic:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info

  beat:
    build: .
    env_file:
      - .env.docker
    volumes:
      - .:/app
    depends_on:
      alembic:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: >-
      celery -A app.core.celery_app.celery_app beat --loglevel=info
      --schedule=/tmp/celerybeat-schedule

volumes:
  postgres_data: